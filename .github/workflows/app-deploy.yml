name: SammyPulse App Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/gatus:${{ github.sha }} ./app

      - name: Push Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/gatus:${{ github.sha }}

      - name: Update task definition image
        run: |
          sed -i "s|gatus:latest|gatus:${GITHUB_SHA}|" app/ecs-task-definition.json

      - name: Register task definition
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://app/ecs-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster sammypulse-cluster \
            --service sammypulse-service \
            --task-definition "$TASK_ARN"

      - name: Wait for ECS service
        run: |
          aws ecs wait services-stable \
            --cluster sammypulse-cluster \
            --services sammypulse-service

      - name: Check application health
        run: |
          curl --fail https://status.sammypulse.co.uk/health
